<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSnagit</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f1f2f5; --hover: #eceef2; --border: #e3e5ea;
    --text: #1c1f25; --muted: #6b7280; --accent: #3b6ef5; --accent-text: #ffffff; --accent-soft: rgba(59,110,245,.12);
    --danger: #e5484d; --work: #e9ebef; --check-a: #dfe2e7; --check-b: #eef0f3;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
    --tooltip-bg: #1c1f25; --tooltip-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191e; --surface: #1e2127; --surface-2: #262930; --hover: #2c3038; --border: #30343c;
      --text: #e8eaee; --muted: #8e95a1; --accent: #5b8cff; --accent-text: #ffffff; --accent-soft: rgba(91,140,255,.16);
      --danger: #ff6369; --work: #111317; --check-a: #24272d; --check-b: #1c1f24;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.45);
      --tooltip-bg: #f1f2f5; --tooltip-text: #17191e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; height: 100vh; height: 100dvh;
    grid-template-columns: 56px minmax(0, 1fr) 252px;
    grid-template-rows: 52px minmax(0, 1fr);
    grid-template-areas: "top top top" "rail work panel";
  }
  body.no-image { grid-template-columns: 0 minmax(0, 1fr) 0; }
  body.no-image .rail, body.no-image .panel, body.no-image .zoombar, body.no-image .needs-image { display: none !important; }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, .swatch:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; flex: none; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); }

  /* ---------- Top bar ---------- */
  .top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 12px;
    background: var(--surface); border-bottom: 1px solid var(--border); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; margin-right: 10px; white-space: nowrap; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff;
    display: grid; place-items: center; }
  .logo svg.i { width: 16px; height: 16px; stroke-width: 2.2; }
  .vsep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  .spacer { flex: 1; }
  .btn-icon { width: 34px; height: 34px; color: var(--muted); }
  .btn-icon:not(:disabled):hover { background: var(--hover); color: var(--text); }
  .btn-ghost { height: 34px; padding: 0 12px; color: var(--text); }
  .btn-ghost:not(:disabled):hover { background: var(--hover); }
  .btn-primary { height: 34px; padding: 0 12px 0 14px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); }
  .btn-primary kbd { background: rgba(255,255,255,.18); border-color: transparent; color: inherit; }

  /* ---------- Tool rail ---------- */
  .rail { grid-area: rail; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0;
    background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: visible; }
  .rail .hsep { width: 24px; height: 1px; background: var(--border); margin: 6px 0; flex: none; }
  .tool { position: relative; width: 38px; height: 38px; color: var(--muted); flex: none; }
  .tool:hover { background: var(--hover); color: var(--text); }
  .tool.active { background: var(--accent-soft); color: var(--accent); }
  .rail .bottom { margin-top: auto; }

  .tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--tooltip-bg); color: var(--tooltip-text);
    padding: 5px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; display: none; align-items: center; gap: 8px;
    box-shadow: var(--shadow); }
  .tooltip.show { display: flex; }
  .tooltip span { opacity: .6; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- Workspace ---------- */
  .work { grid-area: work; position: relative; background: var(--work); min-width: 0; min-height: 0; }
  #main { position: absolute; inset: 0; overflow: auto; display: flex; padding: 32px 32px 80px; }
  #stage { position: relative; margin: auto; line-height: 0; box-shadow: var(--shadow); flex: none; }
  #stage[hidden] { display: none; }
  canvas { display: block; touch-action: none;
    background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px; }
  body.dragging .work::after { content: "Drop image"; position: absolute; inset: 12px; border: 2px dashed var(--accent);
    border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent);
    font-size: 16px; font-weight: 600; pointer-events: none; }

  #empty { margin: auto; text-align: center; max-width: 440px; padding: 40px 32px; }
  #empty[hidden] { display: none; }
  #empty .art { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px; display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shadow); color: var(--accent); }
  #empty .art svg.i { width: 30px; height: 30px; stroke-width: 1.6; }
  #empty h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; }
  #empty p { color: var(--muted); margin: 0; }
  #empty .actions { display: flex; gap: 8px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  #empty .actions .btn-ghost { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
  #empty .hint { margin-top: 26px; font-size: 12px; color: var(--muted); }

  #textEditor { position: absolute; display: none; margin: 0; padding: 0; border: 1px dashed var(--accent);
    background: rgba(0,0,0,.04); outline: none; resize: none; overflow: hidden; white-space: pre;
    line-height: 1.2; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-width: 20px; }

  .zoombar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); white-space: nowrap; }
  .zoombar button { height: 28px; min-width: 28px; padding: 0 8px; color: var(--muted); border-radius: 6px; }
  .zoombar button:hover { background: var(--hover); color: var(--text); }
  .zoombar #zoomLabel { min-width: 56px; color: var(--text); font-variant-numeric: tabular-nums; }
  .zoombar .vsep { height: 16px; }
  .zoombar #dims { color: var(--muted); padding: 0 8px; font-variant-numeric: tabular-nums; font-size: 12px; }

  /* ---------- Inspector ---------- */
  .panel { grid-area: panel; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; }
  .panel-head { padding: 16px 16px 14px; border-bottom: 1px solid var(--border); }
  #ctxTitle { font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #ctxTitle .pill { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    padding: 1px 7px; border-radius: 999px; }
  #ctxTip { color: var(--muted); margin-top: 4px; font-size: 12px; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sec[hidden] { display: none; }
  .sec h4 { margin: 0 0 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .sec h4 output { text-transform: none; letter-spacing: 0; color: var(--text); font-variant-numeric: tabular-nums; }

  .swatches { display: grid; grid-template-columns: repeat(5, 28px); gap: 10px 12px; }
  .swatch { position: relative; width: 28px; height: 28px; border-radius: 50%; padding: 0;
    background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .swatch.active { box-shadow: inset 0 0 0 1px rgba(0,0,0,.14), 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .swatch.none { background: linear-gradient(135deg, transparent 46%, var(--danger) 46% 54%, transparent 54%), var(--surface);
    box-shadow: inset 0 0 0 1px var(--border); }
  .swatch.none.active { box-shadow: inset 0 0 0 1px var(--border), 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .swatch.custom { background: conic-gradient(#ff3b30, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff3b30); cursor: pointer; }
  .swatch.custom::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--c, transparent); }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }

  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 3px; border-radius: 9px; }
  .seg button { height: 30px; color: var(--muted); border-radius: 7px; }
  .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  .btnrow { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .btnrow + .btnrow { margin-top: 8px; }
  .btn-soft { height: 34px; background: var(--surface-2); color: var(--text); padding: 0 8px; }
  .btn-soft:not(:disabled):hover { background: var(--hover); }
  .btn-soft.danger { color: var(--danger); }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }

  /* ---------- Overlays ---------- */
  #toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(12px); opacity: 0; z-index: 60;
    background: var(--tooltip-bg); color: var(--tooltip-text); padding: 10px 14px; border-radius: 10px; transition: .18s;
    pointer-events: none; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; flex: none; }
  #toast.err .dot { background: var(--danger); }

  dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text);
    padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-head { display: flex; align-items: center; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--border); font-weight: 650; font-size: 14px; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; padding: 6px 16px 16px; max-height: 70vh; overflow: auto; }
  .keys h5 { grid-column: 1 / -1; margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .keys div { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; gap: 12px; }

  /* ---------- Narrow screens ---------- */
  @media (max-width: 820px) {
    body, body.no-image { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "rail" "work" "panel"; }
    .rail { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--border); }
    .rail .hsep { width: 1px; height: 24px; margin: 0 4px; }
    .rail .bottom { margin-top: 0; margin-left: auto; }
    .panel { border-left: 0; border-top: 1px solid var(--border); max-height: 34vh; display: flex; flex-wrap: wrap; }
    .panel-head { display: none; }
    .sec { border-bottom: 0; flex: 1 1 220px; }
    .top .label, .top kbd, .brand span, .help-btn { display: none; }
    #main { padding: 16px 16px 72px; }
    .keys { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="no-image">

<header class="top">
  <div class="brand">
    <div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></div>
    <span>OpenSnagit</span>
  </div>
  <div class="needs-image" style="display:flex;gap:2px">
    <button id="undo" class="btn-icon" title="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" class="btn-icon" title="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="spacer"></div>
  <button id="helpBtn" class="btn-icon help-btn" title="Keyboard shortcuts (?)"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  <button id="reset" class="btn-ghost needs-image" title="Start over with a new image">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="label">Reset</span>
  </button>
  <button id="download" class="btn-ghost needs-image" title="Download PNG">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span class="label">Download</span>
  </button>
  <button id="copy" class="btn-primary needs-image" title="Copy image to clipboard">
    <svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
    <span>Copy</span><kbd class="mod-c"></kbd>
  </button>
</header>

<nav class="rail" id="tools"></nav>

<section class="work">
  <div id="main">
    <div id="empty">
      <div class="art"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg></div>
      <h1>Paste a screenshot to start</h1>
      <p>Press <kbd class="mod-v"></kbd> anywhere, drop an image here, or choose a file.</p>
      <div class="actions">
        <button id="pasteBtn" class="btn-primary"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/></svg>Paste from clipboard</button>
        <button id="openBtn" class="btn-ghost">Choose file…</button>
      </div>
      <div class="hint">Tip: paste more images after the first one to stack them on the canvas.</div>
    </div>
    <div id="stage" hidden>
      <canvas id="canvas"></canvas>
      <textarea id="textEditor" spellcheck="false"></textarea>
    </div>
  </div>
  <div class="zoombar">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomLabel" title="Toggle 100% / fit">100%</button>
    <button id="zoomIn" title="Zoom in">+</button>
    <span class="vsep"></span>
    <button id="zoomFit" title="Fit to window">Fit</button>
    <span class="vsep"></span>
    <span id="dims"></span>
  </div>
</section>

<aside class="panel">
  <div class="panel-head">
    <div id="ctxTitle"></div>
    <div id="ctxTip"></div>
  </div>
  <section class="sec" id="secColor"><h4>Color</h4><div class="swatches" id="colors"></div></section>
  <section class="sec" id="secSize">
    <h4><span id="sizeLabel">Stroke</span><output id="sizeVal"></output></h4>
    <input id="size" type="range" min="1" max="10" value="3">
  </section>
  <section class="sec" id="secFill">
    <h4>Style</h4>
    <div class="seg" id="fillSeg"><button data-fill="0">Outline</button><button data-fill="1">Filled</button></div>
  </section>
  <section class="sec" id="secTextBg"><h4>Text background</h4><div class="swatches" id="textBgs"></div></section>
  <section class="sec" id="secArrange">
    <h4>Arrange</h4>
    <div class="btnrow">
      <button class="btn-soft" id="toFront" title="Bring to front (⇧])"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h14M12 20V9M7 13l5-5 5 5"/></svg></button>
      <button class="btn-soft" id="forward" title="Bring forward (])"><svg class="i" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg></button>
      <button class="btn-soft" id="backward" title="Send backward ([)"><svg class="i" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      <button class="btn-soft" id="toBack" title="Send to back (⇧[)"><svg class="i" viewBox="0 0 24 24"><path d="M5 20h14M12 4v11M7 11l5 5 5-5"/></svg></button>
    </div>
    <div class="btnrow">
      <button class="btn-soft" id="dup"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>Duplicate</button>
      <button class="btn-soft danger" id="del"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete</button>
    </div>
  </section>
  <section class="sec" id="secCanvas">
    <h4>Canvas</h4>
    <div class="meta" id="canvasMeta"></div>
    <div class="btnrow"><button class="btn-soft" id="addImage"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add image</button></div>
    <div class="btnrow"><button class="btn-soft" id="clear">Clear annotations</button></div>
  </section>
</aside>

<div class="tooltip" id="tooltip"></div>
<div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>
<input id="file" type="file" accept="image/*" hidden>

<dialog id="help">
  <div class="dlg-head">Keyboard shortcuts<div class="spacer"></div>
    <button class="btn-icon" id="helpClose" title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="keys" id="keys"></div>
</dialog>

<script>
(() => {
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
  const MOD = isMac ? '⌘' : 'Ctrl+';

  // ---------- Tool & palette definitions ----------
  const ICONS = {
    select: '<path d="M5 3l14 8-6 2-2 6z"/>',
    pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
    highlight: '<path d="M9 11l-5 5v4h4l5-5"/><path d="M9 11l6-6 4 4-6 6z"/>',
    arrow: '<path d="M5 19L19 5M10 5h9v9"/>',
    line: '<path d="M5 19L19 5"/>',
    rect: '<rect x="4" y="6" width="16" height="12" rx="1.5"/>',
    ellipse: '<ellipse cx="12" cy="12" rx="9" ry="6.5"/>',
    text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
    number: '<circle cx="12" cy="12" r="9"/><path d="M10.5 9l2-1.5V16"/>',
    pixelate: '<rect x="4" y="4" width="5" height="5"/><rect x="15" y="4" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/><rect x="4" y="15" width="5" height="5"/><rect x="15" y="15" width="5" height="5"/>',
    crop: '<path d="M6 2v16h16M2 6h16v16"/>',
    addImage: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/>',
  };
  // null = separator
  const TOOLS = [
    ['select', 'Select', 'V'], null,
    ['pen', 'Pen', 'P'], ['highlight', 'Highlighter', 'H'], null,
    ['arrow', 'Arrow', 'A'], ['line', 'Line', 'L'], ['rect', 'Rectangle', 'R'], ['ellipse', 'Ellipse', 'E'], null,
    ['text', 'Text', 'T'], ['number', 'Step number', 'N'], null,
    ['pixelate', 'Pixelate', 'B'], ['crop', 'Crop', 'C'],
  ];
  const NAMES = Object.fromEntries(TOOLS.filter(Boolean).map(t => [t[0], t[1]]));
  NAMES.image = 'Image';
  const TIPS = {
    select: 'Click an item to select it. Drag to move, drag the corner to resize, arrow keys to nudge.',
    pen: 'Draw freehand.',
    highlight: 'Drag across text to highlight it.',
    arrow: 'Drag to draw. Hold Shift to snap to 45°.',
    line: 'Drag to draw. Hold Shift to snap to 45°.',
    rect: 'Drag to draw. Hold Shift for a square.',
    ellipse: 'Drag to draw. Hold Shift for a circle.',
    text: `Click to add text. Press Esc or ${MOD}↵ to finish.`,
    number: 'Click to drop numbered steps — they count up automatically.',
    pixelate: 'Drag over anything you want to hide.',
    crop: 'Drag the area to keep. Undo to restore.',
    image: 'Drag to move, drag the corner to resize.',
  };
  const COLORS = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#007aff', '#af52de', '#8e8e93', '#ffffff', '#000000'];
  const TEXT_BGS = [null, '#ffffff', '#000000', '#ffcc00', '#ff3b30', '#34c759', '#007aff', '#af52de', '#f2f2f7'];
  const ZOOM_STEPS = [0.1, 0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 3, 4, 6, 8];

  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  const stage = $('stage'), main = $('main'), editor = $('textEditor');

  for (const el of document.querySelectorAll('.mod-c')) el.textContent = MOD + 'C';
  for (const el of document.querySelectorAll('.mod-v')) el.textContent = MOD + 'V';
  $('undo').title = `Undo (${MOD}Z)`;
  $('redo').title = `Redo (${isMac ? '⇧⌘Z' : 'Ctrl+Y'})`;

  // ---------- Current tool settings ----------
  let tool = 'arrow';
  let curColor = COLORS[0], curSize = 3, curFill = false, curBg = null;

  // ---------- Document state ----------
  let img = null;            // base image
  let objs = [];             // annotations, in stacking order (last = front)
  let crop = null;           // {x,y,w,h} in image coords
  let selected = null;
  let editing = null, editingOrig = '';
  let draft = null;          // object being drawn (also crop preview)
  let drag = null;
  let history = [], hIndex = -1;
  let k = 1;                 // scale factor so sizes look right on large screenshots
  let zoom = 'fit';          // 'fit' or a number
  const images = new Map();  // id -> image element, for images layered on top
  let imgSeq = 0;

  // ---------- Build UI ----------
  const tooltip = $('tooltip');
  function attachTooltip(el, label, key) {
    el.addEventListener('mouseenter', () => {
      if (matchMedia('(max-width: 820px)').matches) return;
      tooltip.innerHTML = '';
      tooltip.append(label);
      if (key) { const s = document.createElement('span'); s.textContent = key; tooltip.append(s); }
      const r = el.getBoundingClientRect();
      tooltip.classList.add('show');
      tooltip.style.left = r.right + 8 + 'px';
      tooltip.style.top = r.top + r.height / 2 - tooltip.offsetHeight / 2 + 'px';
    });
    el.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  }
  const toolsEl = $('tools');
  for (const t of TOOLS) {
    if (!t) { const s = document.createElement('div'); s.className = 'hsep'; toolsEl.appendChild(s); continue; }
    const [name, label, key] = t;
    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.tool = name; b.setAttribute('aria-label', label);
    b.innerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS[name]}</svg>`;
    b.onclick = () => setTool(name);
    attachTooltip(b, label, key);
    toolsEl.appendChild(b);
  }
  const addBtn = document.createElement('button');
  addBtn.className = 'tool bottom'; addBtn.setAttribute('aria-label', 'Add image');
  addBtn.innerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS.addImage}</svg>`;
  addBtn.onclick = () => $('file').click();
  attachTooltip(addBtn, 'Add image', MOD + 'V');
  toolsEl.appendChild(addBtn);

  function buildSwatches(el, list, onPick) {
    for (const c of list) {
      const b = document.createElement('button');
      b.className = 'swatch' + (c ? '' : ' none');
      if (c) b.style.setProperty('--c', c);
      b.dataset.value = c || '';
      b.title = c || 'None';
      b.onclick = () => onPick(c, true);
      el.appendChild(b);
    }
    const wrap = document.createElement('label');
    wrap.className = 'swatch custom'; wrap.title = 'Custom color';
    const inp = document.createElement('input'); inp.type = 'color';
    inp.oninput = () => onPick(inp.value, false);
    inp.onchange = () => onPick(inp.value, true);
    wrap.appendChild(inp); el.appendChild(wrap);
  }
  function markSwatches(el, val) {
    let matched = false;
    for (const b of el.querySelectorAll('button.swatch')) {
      const on = (b.dataset.value || null) === (val || null);
      b.classList.toggle('active', on); matched ||= on;
    }
    const custom = el.querySelector('.custom');
    custom.classList.toggle('active', !matched);
    if (!matched && val) { custom.style.setProperty('--c', val); custom.querySelector('input').value = val; }
    else custom.style.removeProperty('--c');
  }
  buildSwatches($('colors'), COLORS, (c, final) => applyProp('color', c, final));
  buildSwatches($('textBgs'), TEXT_BGS, (c, final) => applyProp('bg', c, final));
  $('size').oninput = () => applyProp('size', +$('size').value, false);
  $('size').onchange = () => applyProp('size', +$('size').value, true);
  for (const b of $('fillSeg').children) b.onclick = () => applyProp('fill', b.dataset.fill === '1', true);

  // Changing a control updates the default for new items and the selected item (if any)
  function applyProp(key, val, final) {
    if (key === 'color') curColor = val;
    if (key === 'size') curSize = val;
    if (key === 'fill') curFill = val;
    if (key === 'bg') curBg = val;
    const o = editing || selected;
    const applies = o && (key === 'bg' ? o.type === 'text' : key === 'fill' ? (o.type === 'rect' || o.type === 'ellipse') : true);
    if (applies) {
      o[key] = val;
      if (editing) styleEditor(); else if (final) commit();
    }
    refreshPanel(); render();
  }

  function setTool(t) {
    commitText();
    tool = t;
    for (const b of toolsEl.querySelectorAll('[data-tool]')) b.classList.toggle('active', b.dataset.tool === t);
    canvas.style.cursor = t === 'select' ? 'default' : t === 'text' ? 'text' : 'crosshair';
    if (t !== 'select') selected = null;
    updateUI(); render();
  }

  // ---------- Inspector ----------
  const show = (id, on) => { $(id).hidden = !on; };
  function refreshPanel() {
    const o = editing || selected;
    const t = o ? o.type : tool;
    show('secColor', !['select', 'crop', 'pixelate', 'image'].includes(t));
    show('secSize', !['select', 'crop', 'image'].includes(t));
    show('secFill', t === 'rect' || t === 'ellipse');
    show('secTextBg', t === 'text');
    show('secArrange', !!selected);
    show('secCanvas', !o);

    const title = $('ctxTitle');
    title.textContent = NAMES[t];
    if (selected) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = 'Selected'; title.append(p); }
    $('ctxTip').textContent = selected && t !== 'image' ? 'Change any option below to update it. Drag to move.' : TIPS[t];
    $('sizeLabel').textContent = { pixelate: 'Block size', text: 'Font size', number: 'Marker size', highlight: 'Width' }[t] || 'Stroke';

    const size = o ? o.size : curSize;
    $('size').value = size; $('sizeVal').textContent = size;
    markSwatches($('colors'), o ? o.color : curColor);
    markSwatches($('textBgs'), o && o.type === 'text' ? o.bg : curBg);
    const fill = o && 'fill' in o ? o.fill : curFill;
    for (const b of $('fillSeg').children) b.classList.toggle('active', (b.dataset.fill === '1') === !!fill);

    if (img) {
      const v = view();
      const n = objs.length;
      $('canvasMeta').textContent = `${Math.round(v.w)} × ${Math.round(v.h)} px · ${n} item${n === 1 ? '' : 's'}` +
        (crop ? ` · cropped from ${img.width} × ${img.height}` : '');
    }
    $('clear').disabled = !objs.length && !crop;
  }

  function updateUI() {
    $('undo').disabled = hIndex <= 0;
    $('redo').disabled = hIndex >= history.length - 1;
    document.body.classList.toggle('no-image', !img);
    refreshPanel();
  }

  // ---------- History ----------
  const clone = o => JSON.parse(JSON.stringify(o));
  function snapshot() { return { img, objs: clone(objs), crop: crop && { ...crop } }; }
  function commit() {
    history = history.slice(0, hIndex + 1);
    history.push(snapshot());
    if (history.length > 100) history.shift();
    hIndex = history.length - 1;
    updateUI();
  }
  function restore(s) {
    const imgChanged = s.img !== img;
    img = s.img; objs = clone(s.objs); crop = s.crop && { ...s.crop }; selected = null;
    if (imgChanged) computeScale();
    resize(); render(); updateUI();
  }
  function undo() { commitText(); if (hIndex > 0) restore(history[--hIndex]); }
  function redo() { if (hIndex < history.length - 1) restore(history[++hIndex]); }

  function computeScale() { k = img ? Math.max(1, Math.max(img.width, img.height) / 1100) : 1; }
  const strokeW = s => (1 + s * 1.2) * k;
  const fontPx = s => (10 + s * 4) * k;
  const numR = s => (9 + s * 2.2) * k;
  const textPad = o => fontPx(o.size) * 0.3;
  const BOX_TYPES = new Set(['rect', 'ellipse', 'pixelate', 'image']);
  const view = () => crop || { x: 0, y: 0, w: img.width, h: img.height };

  // ---------- Loading images ----------
  function loadBlob(blob) {
    if (!blob || !blob.type.startsWith('image/')) return toast('That is not an image', true);
    const im = new Image();
    im.onload = () => {
      commitText();
      if (img) return addImage(im);
      img = im; objs = []; crop = null; selected = null; zoom = 'fit';
      computeScale();
      stage.hidden = false; $('empty').hidden = true;
      commit(); resize(); render();
    };
    im.onerror = () => toast('Could not read that image', true);
    im.src = URL.createObjectURL(blob);
  }

  // Images added after the first are layered on top as movable/resizable objects
  function addImage(im) {
    const id = 'img' + (++imgSeq);
    images.set(id, im);
    const v = view();
    const fit = Math.min(1, v.w * 0.8 / im.width, v.h * 0.8 / im.height);
    const w = im.width * fit, h = im.height * fit;
    const off = (objs.filter(o => o.type === 'image').length % 8) * 24 * k;
    const x = v.x + (v.w - w) / 2 + off, y = v.y + (v.h - h) / 2 + off;
    const o = { type: 'image', src: id, x1: x, y1: y, x2: x + w, y2: y + h, color: curColor, size: 3 };
    objs.push(o);
    setTool('select');
    selected = o;
    commit(); render();
    toast(fit < 1 ? 'Image added and scaled to fit' : 'Image added');
  }

  function reset() {
    if (!img) return;
    if ((objs.length || crop) && !confirm('Start over? This removes the current image and all annotations.')) return;
    commitText();
    img = null; objs = []; crop = null; selected = null; draft = null; drag = null;
    images.clear(); history = []; hIndex = -1;
    stage.hidden = true; $('empty').hidden = false;
    updateUI();
  }

  document.addEventListener('paste', e => {
    if (document.activeElement === editor) return;
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); loadBlob(item.getAsFile()); }
    else toast('No image found on the clipboard', true);
  });
  $('pasteBtn').onclick = async () => {
    try {
      for (const item of await navigator.clipboard.read()) {
        const type = item.types.find(t => t.startsWith('image/'));
        if (type) return loadBlob(await item.getType(type));
      }
      toast('No image found on the clipboard', true);
    } catch { toast(`Clipboard access blocked — press ${MOD}V instead`, true); }
  };
  $('openBtn').onclick = $('addImage').onclick = () => $('file').click();
  $('file').onchange = e => { if (e.target.files[0]) loadBlob(e.target.files[0]); e.target.value = ''; };

  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    dragDepth++; document.body.classList.add('dragging');
  });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) loadBlob(f);
  });

  // ---------- Layout & zoom ----------
  function fitScale() {
    const v = view();
    return Math.min(1, (main.clientWidth - 64) / v.w, (main.clientHeight - 112) / v.h);
  }
  const curScale = () => zoom === 'fit' ? fitScale() : zoom;
  function resize() {
    if (!img) return;
    const v = view(), w = Math.round(v.w), h = Math.round(v.h);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const s = curScale();
    canvas.style.width = v.w * s + 'px';
    canvas.style.height = v.h * s + 'px';
    $('zoomLabel').textContent = Math.round(s * 100) + '%';
    $('dims').textContent = `${w} × ${h}`;
    if (editing) styleEditor();
  }
  function setZoom(z) {
    zoom = z === 'fit' ? 'fit' : Math.min(8, Math.max(0.05, z));
    resize(); render();
  }
  const zoomIn = () => setZoom(ZOOM_STEPS.find(z => z > curScale() + 0.001) ?? 8);
  const zoomOut = () => setZoom([...ZOOM_STEPS].reverse().find(z => z < curScale() - 0.001) ?? 0.05);
  $('zoomIn').onclick = zoomIn;
  $('zoomOut').onclick = zoomOut;
  $('zoomFit').onclick = () => setZoom('fit');
  $('zoomLabel').onclick = () => setZoom(zoom === 1 ? 'fit' : 1);
  main.addEventListener('wheel', e => {
    if (!img || !(e.ctrlKey || e.metaKey)) return;   // pinch-to-zoom arrives as ctrl+wheel
    e.preventDefault();
    setZoom(curScale() * Math.exp(-e.deltaY * 0.01));
  }, { passive: false });
  window.addEventListener('resize', () => { resize(); render(); });
  const displayScale = () => canvas.getBoundingClientRect().width / canvas.width;

  // ---------- Rendering ----------
  const pixCanvas = document.createElement('canvas');
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  function norm(o) {
    return { x: Math.min(o.x1, o.x2), y: Math.min(o.y1, o.y2), w: Math.abs(o.x2 - o.x1), h: Math.abs(o.y2 - o.y1) };
  }

  function drawObj(c, o) {
    c.save();
    c.strokeStyle = c.fillStyle = o.color;
    c.lineWidth = strokeW(o.size);
    c.lineCap = c.lineJoin = 'round';
    switch (o.type) {
      case 'pen': case 'highlight': {
        if (o.type === 'highlight') {
          c.globalAlpha = 0.4; c.lineWidth = strokeW(o.size) * 4; c.lineCap = 'butt';
          c.globalCompositeOperation = 'multiply';
        }
        const p = o.pts;
        c.beginPath(); c.moveTo(p[0][0], p[0][1]);
        if (p.length === 1) c.lineTo(p[0][0] + 0.1, p[0][1]);
        for (let i = 1; i < p.length - 1; i++) {
          c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
        }
        if (p.length > 1) c.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
        c.stroke(); break;
      }
      case 'line': case 'arrow': {
        const { x1, y1, x2, y2 } = o;
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const head = Math.max(12 * k, c.lineWidth * 3.5);
        const len = Math.hypot(x2 - x1, y2 - y1);
        const ex = o.type === 'arrow' && len > head ? x2 - Math.cos(ang) * head * 0.8 : x2;
        const ey = o.type === 'arrow' && len > head ? y2 - Math.sin(ang) * head * 0.8 : y2;
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(ex, ey); c.stroke();
        if (o.type === 'arrow') {
          c.beginPath();
          c.moveTo(x2, y2);
          c.lineTo(x2 - head * Math.cos(ang - 0.45), y2 - head * Math.sin(ang - 0.45));
          c.lineTo(x2 - head * Math.cos(ang + 0.45), y2 - head * Math.sin(ang + 0.45));
          c.closePath(); c.fill();
        }
        break;
      }
      case 'rect': case 'ellipse': {
        const r = norm(o);
        c.beginPath();
        if (o.type === 'rect') c.rect(r.x, r.y, r.w, r.h);
        else c.ellipse(r.x + r.w / 2, r.y + r.h / 2, r.w / 2, r.h / 2, 0, 0, Math.PI * 2);
        if (o.fill) c.fill(); else c.stroke();
        break;
      }
      case 'pixelate': {
        // Pixelates everything drawn beneath it (base image, added images, annotations)
        const r = norm(o), v = view();
        const x = Math.max(v.x, r.x), y = Math.max(v.y, r.y);
        const w = Math.min(v.x + v.w, r.x + r.w) - x, h = Math.min(v.y + v.h, r.y + r.h) - y;
        if (w < 1 || h < 1) break;
        const block = Math.max(4, (4 + o.size * 2) * k);
        const tw = Math.max(1, Math.ceil(w / block)), th = Math.max(1, Math.ceil(h / block));
        pixCanvas.width = tw; pixCanvas.height = th;
        const pc = pixCanvas.getContext('2d');
        pc.imageSmoothingEnabled = true;
        pc.drawImage(c.canvas, x - v.x, y - v.y, w, h, 0, 0, tw, th);
        c.imageSmoothingEnabled = false;
        c.drawImage(pixCanvas, 0, 0, tw, th, x, y, w, h);
        break;
      }
      case 'text': {
        const fs = fontPx(o.size);
        c.font = `600 ${fs}px ${FONT}`;
        c.textBaseline = 'top';
        if (o.bg) {
          const m = textMetrics(o), p = textPad(o);
          c.fillStyle = o.bg;
          c.beginPath(); c.roundRect(o.x - p, o.y - p, m.w + p * 2, m.h + p * 2, p * 0.6); c.fill();
          c.fillStyle = o.color;
        } else {
          // outline for contrast on any background
          c.lineWidth = Math.max(2, fs / 7);
          c.strokeStyle = isLight(o.color) ? 'rgba(0,0,0,.75)' : 'rgba(255,255,255,.85)';
        }
        o.text.split('\n').forEach((line, i) => {
          if (!o.bg) c.strokeText(line, o.x, o.y + i * fs * 1.2);
          c.fillText(line, o.x, o.y + i * fs * 1.2);
        });
        break;
      }
      case 'number': {
        const r = numR(o.size);
        c.beginPath(); c.arc(o.x, o.y, r, 0, Math.PI * 2); c.fill();
        c.lineWidth = Math.max(1.5, r / 8); c.strokeStyle = '#fff'; c.stroke();
        c.fillStyle = isLight(o.color) ? '#000' : '#fff';
        c.font = `700 ${r * 1.15}px ${FONT}`;
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(String(o.n), o.x, o.y + r * 0.05);
        break;
      }
      case 'image': {
        const r = norm(o), im = images.get(o.src);
        if (!im) break;
        // soft shadow so a stacked screenshot stands out from the one beneath it
        c.shadowColor = 'rgba(0,0,0,.28)'; c.shadowBlur = 18 * k; c.shadowOffsetY = 4 * k;
        c.drawImage(im, r.x, r.y, r.w, r.h);
        break;
      }
    }
    c.restore();
  }

  function isLight(hex) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return false;
    const [r, g, b] = m.slice(1).map(h => parseInt(h, 16));
    return 0.299 * r + 0.587 * g + 0.114 * b > 170;
  }

  function render(forExport = false) {
    if (!img) return;
    const v = view(), ds = displayScale();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(-v.x, -v.y);
    ctx.drawImage(img, 0, 0);
    for (const o of objs) if (o !== editing) drawObj(ctx, o);
    if (forExport) return;
    if (draft && draft.type !== 'crop') drawObj(ctx, draft);
    if (draft && draft.type === 'crop') {
      const r = norm(draft);
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.rect(v.x, v.y, v.w, v.h);
      ctx.rect(r.x, r.y, r.w, r.h);
      ctx.fill('evenodd');
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / ds; ctx.setLineDash([6 / ds, 4 / ds]);
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.restore();
    }
    if (selected) {
      const b = bbox(selected), pad = 6 / ds;
      ctx.save();
      ctx.strokeStyle = '#3b6ef5'; ctx.lineWidth = 1.5 / ds;
      ctx.setLineDash([5 / ds, 4 / ds]);
      ctx.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
      if (BOX_TYPES.has(selected.type)) {
        const [hx, hy] = handlePos(selected), hs = 10 / ds;
        ctx.setLineDash([]);
        ctx.fillStyle = '#fff';
        ctx.fillRect(hx - hs / 2, hy - hs / 2, hs, hs);
        ctx.strokeRect(hx - hs / 2, hy - hs / 2, hs, hs);
      }
      ctx.restore();
    }
  }

  // ---------- Geometry / hit testing ----------
  function textMetrics(o) {
    const fs = fontPx(o.size);
    ctx.save();
    ctx.font = `600 ${fs}px ${FONT}`;
    const lines = o.text.split('\n');
    const w = Math.max(...lines.map(l => ctx.measureText(l).width));
    ctx.restore();
    return { w, h: lines.length * fs * 1.2 };
  }
  function bbox(o) {
    switch (o.type) {
      case 'pen': case 'highlight': {
        const xs = o.pts.map(p => p[0]), ys = o.pts.map(p => p[1]);
        const pad = strokeW(o.size) * (o.type === 'highlight' ? 2 : 0.5);
        const x = Math.min(...xs) - pad, y = Math.min(...ys) - pad;
        return { x, y, w: Math.max(...xs) + pad - x, h: Math.max(...ys) + pad - y };
      }
      case 'text': {
        const m = textMetrics(o), p = o.bg ? textPad(o) : 0;
        return { x: o.x - p, y: o.y - p, w: m.w + p * 2, h: m.h + p * 2 };
      }
      case 'number': { const r = numR(o.size); return { x: o.x - r, y: o.y - r, w: r * 2, h: r * 2 }; }
      default: return norm(o);
    }
  }
  function distSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2)) : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }
  function hit(o, x, y) {
    const tol = Math.max(8 / displayScale(), strokeW(o.size));
    if (o.type === 'line' || o.type === 'arrow') return distSeg(x, y, o.x1, o.y1, o.x2, o.y2) <= tol;
    if (o.type === 'pen' || o.type === 'highlight') {
      const t = o.type === 'highlight' ? tol * 2 : tol;
      for (let i = 0; i < o.pts.length - 1; i++)
        if (distSeg(x, y, ...o.pts[i], ...o.pts[i + 1]) <= t) return true;
      return o.pts.length === 1 && Math.hypot(x - o.pts[0][0], y - o.pts[0][1]) <= t;
    }
    if ((o.type === 'rect' || o.type === 'ellipse') && !o.fill) {
      const r = norm(o);
      const inOuter = x >= r.x - tol && x <= r.x + r.w + tol && y >= r.y - tol && y <= r.y + r.h + tol;
      const inInner = x > r.x + tol && x < r.x + r.w - tol && y > r.y + tol && y < r.y + r.h - tol;
      return inOuter && !inInner;
    }
    const b = bbox(o);
    return x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 4;
  }
  function pick(x, y) {
    for (let i = objs.length - 1; i >= 0; i--) if (hit(objs[i], x, y)) return objs[i];
    return null;
  }
  // Bottom-right resize handle for box-shaped objects
  function handlePos(o) {
    const b = bbox(o), pad = 6 / displayScale();
    return [b.x + b.w + pad, b.y + b.h + pad];
  }
  function onHandle(o, x, y) {
    if (!o || !BOX_TYPES.has(o.type)) return false;
    const [hx, hy] = handlePos(o), t = 9 / displayScale();
    return Math.abs(x - hx) <= t && Math.abs(y - hy) <= t;
  }
  function moveObj(o, dx, dy) {
    if (o.pts) o.pts.forEach(p => { p[0] += dx; p[1] += dy; });
    if ('x1' in o) { o.x1 += dx; o.x2 += dx; o.y1 += dy; o.y2 += dy; }
    if ('x' in o) { o.x += dx; o.y += dy; }
  }
  const nextStep = () => objs.filter(o => o.type === 'number').reduce((m, o) => Math.max(m, o.n), 0) + 1;

  // ---------- Pointer interaction ----------
  function toImage(e) {
    const r = canvas.getBoundingClientRect(), v = view();
    return [(e.clientX - r.left) / r.width * canvas.width + v.x, (e.clientY - r.top) / r.height * canvas.height + v.y];
  }

  canvas.addEventListener('pointerdown', e => {
    if (!img || e.button !== 0) return;
    if (editing) { commitText(); return; }
    const [x, y] = toImage(e);
    canvas.setPointerCapture(e.pointerId);

    if (tool === 'select') {
      if (onHandle(selected, x, y)) {
        const r = norm(selected);
        Object.assign(selected, { x1: r.x, y1: r.y, x2: r.x + r.w, y2: r.y + r.h });
        drag = { mode: 'resize', ratio: r.w / r.h || 1, moved: false };
        return;
      }
      selected = pick(x, y);
      if (selected) drag = { mode: 'move', lx: x, ly: y, moved: false };
      updateUI(); render(); return;
    }
    selected = null;
    if (tool === 'text') {
      const existing = pick(x, y);
      if (existing && existing.type === 'text') return startText(existing);
      return startText({ type: 'text', x, y: y - fontPx(curSize) * 0.6, text: '', color: curColor, size: curSize, bg: curBg });
    }
    if (tool === 'number') {
      objs.push({ type: 'number', x, y, n: nextStep(), color: curColor, size: curSize });
      commit(); render(); return;
    }
    if (tool === 'pen' || tool === 'highlight') draft = { type: tool, pts: [[x, y]], color: curColor, size: curSize };
    else draft = { type: tool, x1: x, y1: y, x2: x, y2: y, color: curColor, size: curSize, fill: curFill };
    drag = { mode: 'draw' };
    render();
  });

  canvas.addEventListener('pointermove', e => {
    if (!img) return;
    const [x, y] = toImage(e);
    if (tool === 'select' && !drag) {
      canvas.style.cursor = onHandle(selected, x, y) ? 'nwse-resize' : pick(x, y) ? 'move' : 'default';
    }
    if (!drag) return;
    if (drag.mode === 'resize') {
      const min = 8 / displayScale();
      const w = Math.max(min, x - selected.x1);
      let h = Math.max(min, y - selected.y1);
      if (selected.type === 'image' || e.shiftKey) h = w / drag.ratio;   // keep aspect ratio
      selected.x2 = selected.x1 + w; selected.y2 = selected.y1 + h;
      drag.moved = true;
    } else if (drag.mode === 'move') {
      moveObj(selected, x - drag.lx, y - drag.ly);
      drag.lx = x; drag.ly = y; drag.moved = true;
    } else if (draft.pts) {
      const last = draft.pts[draft.pts.length - 1];
      if (Math.hypot(x - last[0], y - last[1]) > 1.5 / displayScale()) draft.pts.push([x, y]);
    } else {
      let nx = x, ny = y;
      if (e.shiftKey) {
        const dx = x - draft.x1, dy = y - draft.y1;
        if (draft.type === 'line' || draft.type === 'arrow') {
          const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4), len = Math.hypot(dx, dy);
          nx = draft.x1 + Math.cos(ang) * len; ny = draft.y1 + Math.sin(ang) * len;
        } else {
          const s = Math.max(Math.abs(dx), Math.abs(dy));
          nx = draft.x1 + Math.sign(dx || 1) * s; ny = draft.y1 + Math.sign(dy || 1) * s;
        }
      }
      draft.x2 = nx; draft.y2 = ny;
    }
    render();
  });

  canvas.addEventListener('pointerup', () => {
    if (!drag) return;
    if (drag.mode === 'move' || drag.mode === 'resize') { if (drag.moved) commit(); }
    else if (draft) {
      const tiny = !draft.pts && Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1) < 4 / displayScale();
      if (draft.type === 'crop') {
        if (!tiny) {
          const r = norm(draft), v = view();
          const x = Math.max(v.x, r.x), y = Math.max(v.y, r.y);
          const w = Math.min(v.x + v.w, r.x + r.w) - x, h = Math.min(v.y + v.h, r.y + r.h) - y;
          if (w > 4 && h > 4) {
            crop = { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };
            draft = null; zoom = 'fit';
            commit(); resize(); setTool('select');
          }
        }
      } else if (!tiny) { objs.push(draft); commit(); }
      draft = null;
    }
    drag = null; render();
  });

  canvas.addEventListener('dblclick', e => {
    const [x, y] = toImage(e);
    const o = pick(x, y);
    if (o && o.type === 'text') startText(o);
  });

  // ---------- Text editing ----------
  function startText(o) {
    commitText();
    editing = o; editingOrig = JSON.stringify([o.text, o.bg]); selected = null;
    if (!objs.includes(o)) objs.push(o);
    editor.value = o.text;
    styleEditor();
    updateUI(); render();
    setTimeout(() => { editor.focus(); editor.select(); });
  }
  function styleEditor() {
    const o = editing, s = displayScale(), v = view(), fs = fontPx(o.size) * s;
    const p = o.bg ? textPad(o) * s : 0;
    Object.assign(editor.style, {
      display: 'block', left: (o.x - v.x) * s - p + 'px', top: (o.y - v.y) * s - p + 'px',
      padding: p + 'px', borderRadius: p * 0.6 + 'px', background: o.bg || 'rgba(0,0,0,.04)',
      fontSize: fs + 'px', color: o.color, minHeight: fs * 1.2 + p * 2 + 'px',
    });
    autosize();
  }
  function autosize() {
    editor.style.width = '0px'; editor.style.height = '0px';
    editor.style.width = editor.scrollWidth + 8 + 'px';
    editor.style.height = editor.scrollHeight + 2 + 'px';
  }
  function commitText() {
    if (!editing) return;
    const o = editing; editing = null;
    editor.style.display = 'none';
    const t = editor.value.replace(/\s+$/, '');
    if (!t) objs.splice(objs.indexOf(o), 1);
    else { o.text = t; selected = o; }   // keep it selected so inspector changes apply to it
    if (JSON.stringify([t, o.bg]) !== editingOrig) commit();
    updateUI(); render();
  }
  editor.addEventListener('input', autosize);
  editor.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape' || (e.key === 'Enter' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); commitText(); }
  });
  editor.addEventListener('blur', commitText);

  // ---------- Item actions ----------
  function deleteSelected() {
    if (!selected) return;
    objs.splice(objs.indexOf(selected), 1);
    selected = null; commit(); render();
  }
  function duplicate() {
    if (!selected) return;
    const o = clone(selected);
    moveObj(o, 16 * k, 16 * k);
    if (o.type === 'number') o.n = nextStep();
    objs.push(o); selected = o;
    commit(); render();
  }
  function arrange(where) {
    if (!selected) return;
    const i = objs.indexOf(selected);
    const j = where === 'front' ? objs.length - 1 : where === 'back' ? 0
      : where === 'forward' ? Math.min(objs.length - 1, i + 1) : Math.max(0, i - 1);
    if (i === j) return toast(where === 'front' || where === 'forward' ? 'Already at the front' : 'Already at the back');
    objs.splice(i, 1);
    objs.splice(j, 0, selected);
    commit(); render();
  }
  let nudgeTimer;
  function nudge(dx, dy) {
    moveObj(selected, dx, dy); render();
    clearTimeout(nudgeTimer);
    nudgeTimer = setTimeout(commit, 400);
  }
  $('del').onclick = deleteSelected;
  $('dup').onclick = duplicate;
  $('toFront').onclick = () => arrange('front');
  $('forward').onclick = () => arrange('forward');
  $('backward').onclick = () => arrange('backward');
  $('toBack').onclick = () => arrange('back');
  $('undo').onclick = undo;
  $('redo').onclick = redo;
  $('reset').onclick = reset;
  $('clear').onclick = () => {
    if (!objs.length && !crop) return;
    objs = []; crop = null; selected = null; commit(); resize(); render();
  };

  // ---------- Export ----------
  function exportBlob() {
    commitText();
    render(true);
    return new Promise(res => canvas.toBlob(b => { render(); res(b); }, 'image/png'));
  }
  async function copyImage() {
    if (!img) return;
    if (!window.ClipboardItem || !navigator.clipboard?.write) {
      return toast('Image copy needs a secure page (file:// or localhost) — use Download instead', true);
    }
    try {
      // Passing a promise keeps Safari's user-gesture requirement satisfied
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportBlob() })]);
      toast('Copied — paste it anywhere');
    } catch (err) {
      console.error(err);
      toast('Copy failed — use Download instead', true);
    }
  }
  $('copy').onclick = copyImage;
  $('download').onclick = async () => {
    const b = await exportBlob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `annotated-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  let toastTimer;
  function toast(msg, err = false) {
    const t = $('toast');
    $('toastMsg').textContent = msg;
    t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = '', 2200);
  }

  // ---------- Shortcuts sheet ----------
  const KEYS = [
    ['Tools'], ...TOOLS.filter(Boolean).map(([, label, key]) => [label, key]),
    ['Edit'],
    ['Paste image / add another', MOD + 'V'], ['Copy result', MOD + 'C'],
    ['Undo', MOD + 'Z'], ['Redo', isMac ? '⇧⌘Z' : 'Ctrl+Y'],
    ['Delete selected', '⌫'], ['Duplicate', MOD + 'D'],
    ['Nudge (×10 with Shift)', '← ↑ → ↓'], ['Deselect', 'Esc'],
    ['Arrange'],
    ['Bring forward / backward', '] / ['], ['Bring to front / back', '⇧] / ⇧['],
    ['View'],
    ['Zoom in / out', `${MOD}+ / ${MOD}−`], ['Fit / 100%', `${MOD}0 / ${MOD}1`],
    ['Show shortcuts', '?'],
  ];
  const keysEl = $('keys');
  for (const [label, key] of KEYS) {
    if (!key) { const h = document.createElement('h5'); h.textContent = label; keysEl.appendChild(h); continue; }
    const row = document.createElement('div');
    const l = document.createElement('span'); l.textContent = label;
    const kb = document.createElement('kbd'); kb.textContent = key;
    row.append(l, kb); keysEl.appendChild(row);
  }
  const help = $('help');
  $('helpBtn').onclick = () => help.showModal();
  $('helpClose').onclick = () => help.close();
  help.addEventListener('click', e => { if (e.target === help) help.close(); });

  // ---------- Keyboard ----------
  document.addEventListener('keydown', e => {
    if (document.activeElement === editor || help.open) return;
    if (e.target instanceof HTMLInputElement && e.target.type !== 'range') return;
    const mod = e.metaKey || e.ctrlKey, key = e.key.toLowerCase();
    if (e.key === '?') { help.showModal(); return; }
    if (!img) return;
    if (mod && key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && key === 'y') { e.preventDefault(); redo(); return; }
    if (mod && key === 'd') { e.preventDefault(); duplicate(); return; }
    if (mod && (key === '=' || key === '+')) { e.preventDefault(); zoomIn(); return; }
    if (mod && key === '-') { e.preventDefault(); zoomOut(); return; }
    if (mod && key === '0') { e.preventDefault(); setZoom('fit'); return; }
    if (mod && key === '1') { e.preventDefault(); setZoom(1); return; }
    if (mod && key === 'c') {
      if (String(window.getSelection())) return;
      e.preventDefault(); copyImage(); return;
    }
    if (mod) return;
    if (selected) {
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
      const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (arrows) {
        e.preventDefault();
        const step = (e.shiftKey ? 10 : 1) / displayScale();
        nudge(arrows[0] * step, arrows[1] * step); return;
      }
      if (e.code === 'BracketRight' || e.code === 'BracketLeft') {
        e.preventDefault();
        const up = e.code === 'BracketRight';
        arrange(e.shiftKey ? (up ? 'front' : 'back') : (up ? 'forward' : 'backward'));
        return;
      }
    }
    if (e.key === 'Escape') { selected = null; draft = null; drag = null; updateUI(); render(); return; }
    const t = TOOLS.find(t => t && t[2].toLowerCase() === key);
    if (t) setTool(t[0]);
  });

  setTool(tool);
})();
</script>
</body>
</html>
